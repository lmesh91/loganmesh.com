<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loganmesh.com // interactive terminal</title>
<style>
/*
  Interactive terminal mockup v4.
  Main content is only the terminal window. No side column. No external input bar.
  The active command prompt is inside the terminal output.
*/

@font-face {
  font-family: "Departure Mono Local";
  src: url("./assets/DepartureMono-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #000806;
  --desk: #00110d;
  --terminal: #020b08;
  --title: #00231d;
  --fg: #a7ffc5;
  --strong: #d8ffe5;
  --dim: #5aa974;
  --faint: #24553a;
  --green: #73ff98;
  --cyan: #57ecff;
  --blue: #6ea8ff;
  --yellow: #e2ff82;
  --red: #ff8d8d;
  --shadow: rgba(0, 0, 0, .58);
  --font: "Departure Mono Local", "Departure Mono", "DepartureMono",
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--fg);
  background: var(--desk);
  font-family: var(--font);
  letter-spacing: .01em;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to bottom, rgba(115,255,152,.045) 1px, transparent 1px),
    linear-gradient(to right, rgba(87,236,255,.018) 1px, transparent 1px);
  background-size: 100% 4px, 64px 64px;
  z-index: 10;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 14vw rgba(0,0,0,.78);
  z-index: 11;
}

button {
  font: inherit;
}

a {
  color: var(--cyan);
  text-decoration: none;
}

a:hover {
  color: var(--yellow);
  text-decoration: underline;
}

.shell {
  position: relative;
  z-index: 2;
  width: min(1440px, calc(100% - 20px));
  height: 100vh;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 10px 0;
}

.topline {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--dim);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.topline b {
  color: var(--green);
  font-weight: 400;
}

.topline span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.topline span:last-child {
  text-align: right;
}

.window {
  min-height: 0;
  background: var(--terminal);
  border: 2px solid var(--faint);
  border-radius: 9px;
  box-shadow:
    0 22px 70px var(--shadow),
    0 0 0 1px #001b13 inset;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
}

.titlebar {
  height: 38px;
  background: var(--title);
  border-bottom: 1px solid var(--faint);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  color: var(--strong);
  font-size: 13px;
}

.lights {
  display: flex;
  gap: 6px;
  margin-right: 2px;
}

.light {
  width: 11px;
  height: 11px;
  border: 1px solid var(--faint);
  border-radius: 50%;
}

.light.red { background: #491717; }
.light.yellow { background: #3f3f12; }
.light.green { background: #12451d; }

.titlebar .path {
  color: var(--cyan);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.screen {
  min-height: 0;
  overflow-y: auto;
  padding: 14px 14px 20px;
  scrollbar-color: var(--faint) var(--terminal);
  scrollbar-width: thin;
  cursor: text;
}

.screen pre,
.screen div {
  font-size: 14px;
  line-height: 1.45;
}

.line {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.input-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.prompt {
  color: var(--green);
}

.cwd {
  color: var(--blue);
}

.cmdtext {
  color: var(--strong);
}

.current-input {
  display: inline-block;
  min-width: 1ch;
  min-height: 1em;
  line-height: inherit;
  vertical-align: baseline;
  outline: none;
  color: var(--strong);
  caret-color: var(--green);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.current-input:empty::before {
  content: "";
}

.current-input[contenteditable="true"] {
  -webkit-user-select: text;
  user-select: text;
}

.dim { color: var(--dim); }
.faint { color: var(--faint); }
.green { color: var(--green); }
.cyan { color: var(--cyan); }
.blue { color: var(--blue); }
.yellow { color: var(--yellow); }
.red { color: var(--red); }
.output { color: var(--fg); }

.blank {
  height: 1em;
}

.terminal-command {
  display: inline;
  border: 0;
  background: transparent;
  color: var(--cyan);
  padding: 0;
  margin: 0;
  cursor: pointer;
  text-align: left;
}

.terminal-command:hover {
  color: var(--yellow);
  text-decoration: underline;
}

.command-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  column-gap: 2ch;
  row-gap: .2em;
  margin: .25rem 0;
}

.command-list button {
  width: max-content;
}

.ascii-logo {
  color: var(--green);
  white-space: pre;
  overflow-x: auto;
  line-height: 1.05;
  margin: 0 0 10px;
  font-size: 12px;
}

.footer {
  color: var(--faint);
  font-size: 12px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

kbd {
  border: 1px solid var(--faint);
  color: var(--yellow);
  padding: 0 4px;
  background: #03140f;
}

@media (max-width: 560px) {
  .shell {
    width: min(100% - 8px, 1440px);
    gap: 6px;
    padding: 4px 0 8px;
  }

  .topline {
    font-size: 10px;
  }

  .topline span:last-child {
    display: none;
  }

  .titlebar {
    height: 34px;
    font-size: 11px;
    padding: 0 9px;
  }

  .screen {
    padding: 10px 9px 16px;
  }

  .screen pre,
  .screen div {
    font-size: 12px;
  }

  .ascii-logo {
    font-size: 8px;
  }

  .command-list {
    grid-template-columns: 1fr;
    row-gap: .45em;
  }

  .footer {
    font-size: 10px;
  }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topline">
    <span><b>loganmesh.com</b> // terminal prototype</span>
    <span>contact: email@example.com // github: @placeholder // linkedin: /in/placeholder</span>
  </div>

  <section class="window" aria-label="Interactive terminal">
    <div class="titlebar">
      <div class="lights" aria-hidden="true">
        <span class="light red"></span>
        <span class="light yellow"></span>
        <span class="light green"></span>
      </div>
      <span class="path">guest@loganmesh:~/site</span>
    </div>

    <div id="screen" class="screen" aria-live="polite" tabindex="0"></div>
  </section>

  <footer class="footer">
    Tip: use <kbd>↑</kbd>/<kbd>↓</kbd> for command history. On mobile, run <button class="terminal-command" data-command="help" type="button">help</button> and tap commands directly.
  </footer>
</div>

<script>
(function () {
  "use strict";

  const screen = document.getElementById("screen");

  let history = [];
  let historyIndex = -1;
  let booting = false;
  let activeInput = null;

  const state = {
    cwd: "~/site",
    bootedAt: new Date()
  };

  const logo = "\u2591\u2588\u2588                                                        \u2591\u2588\u2588\u2588     \u2591\u2588\u2588\u2588                       \u2591\u2588\u2588        \n\u2591\u2588\u2588                                                        \u2591\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588                       \u2591\u2588\u2588        \n\u2591\u2588\u2588          \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588     \u2591\u2588\u2588\u2591\u2588\u2588 \u2591\u2588\u2588\u2591\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \n\u2591\u2588\u2588         \u2591\u2588\u2588    \u2591\u2588\u2588 \u2591\u2588\u2588    \u2591\u2588\u2588       \u2591\u2588\u2588  \u2591\u2588\u2588    \u2591\u2588\u2588    \u2591\u2588\u2588 \u2591\u2588\u2588\u2588\u2588 \u2591\u2588\u2588 \u2591\u2588\u2588    \u2591\u2588\u2588 \u2591\u2588\u2588        \u2591\u2588\u2588    \u2591\u2588\u2588 \n\u2591\u2588\u2588         \u2591\u2588\u2588    \u2591\u2588\u2588 \u2591\u2588\u2588    \u2591\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588    \u2591\u2588\u2588    \u2591\u2588\u2588  \u2591\u2588\u2588  \u2591\u2588\u2588 \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588    \u2591\u2588\u2588 \n\u2591\u2588\u2588         \u2591\u2588\u2588    \u2591\u2588\u2588 \u2591\u2588\u2588   \u2591\u2588\u2588\u2588 \u2591\u2588\u2588   \u2591\u2588\u2588  \u2591\u2588\u2588    \u2591\u2588\u2588    \u2591\u2588\u2588       \u2591\u2588\u2588 \u2591\u2588\u2588               \u2591\u2588\u2588 \u2591\u2588\u2588    \u2591\u2588\u2588 \n\u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588\u2588\u2591\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2591\u2588\u2588 \u2591\u2588\u2588    \u2591\u2588\u2588    \u2591\u2588\u2588       \u2591\u2588\u2588  \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588   \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588  \u2591\u2588\u2588    \u2591\u2588\u2588 \n                              \u2591\u2588\u2588                                                                         \n                        \u2591\u2588\u2588\u2588\u2588\u2588\u2588\u2588                                                                          \n                                                                                                          ";

  const bootLines = [
    { text: "loganmesh kernel 0.5.1-terminal #1 SMP static-site", cls: "green", delay: 80 },
    { text: "Command line: root=/dev/site theme=terminal interactive=1 cards=0 inputbar=0", cls: "dim", delay: 90 },
    { text: "[    0.000000] boot: initializing loganmesh.com", cls: "", delay: 95 },
    { text: "[    0.041112] font: Departure Mono requested; local webfont hook checked", cls: "", delay: 80 },
    { text: "[    0.083821] layout: terminal window occupies main viewport", cls: "", delay: 75 },
    { text: "[    0.121449] input: inline editable shell prompt attached", cls: "", delay: 80 },
    { text: "[    0.160700] mobile: clickable terminal commands enabled", cls: "", delay: 90 },
    { text: "[    0.211004] blogd: indexing placeholder posts", cls: "", delay: 70 },
    { text: "[    0.287110] status: ready", cls: "green", delay: 110 }
  ];

  const content = {
    about: [
      ["name", "Logan Mesh"],
      ["site", "loganmesh.com"],
      ["summary", "Placeholder intro. Replace this with a compact statement of what you build, study, and write about."],
      ["focus", "math / software / formal tools / games / algorithms / writing"],
      ["status", "editing site architecture"]
    ],
    projects: [
      { id: "alpha", title: "Project Alpha", status: "active", summary: "Placeholder for the main project you want people to open first.", tags: "tag, tag, tag" },
      { id: "beta", title: "Project Beta", status: "draft", summary: "Placeholder for a research-flavored tool, algorithm, or proof-related build.", tags: "tag, tag, tag" },
      { id: "gamma", title: "Project Gamma", status: "paused", summary: "Placeholder for a game, benchmark, visualization, or smaller experiment.", tags: "tag, tag, tag" },
      { id: "delta", title: "Project Delta", status: "archive", summary: "Placeholder for older or less polished material.", tags: "tag, tag, tag" }
    ],
    notes: [
      ["notes/math/placeholder-proof-note.txt", "Proof note placeholder"],
      ["notes/systems/placeholder-tooling-log.txt", "Tooling and implementation notes"],
      ["notes/games/placeholder-engine-note.txt", "Games, mods, mechanics, and benchmarks"],
      ["notes/misc/placeholder-fragment.txt", "Fragments and unsorted thoughts"]
    ],
    posts: [
      { id: "post", date: "2026-05-23", type: "featured", title: "Placeholder title for a long technical post", read: "12 min", summary: "Preview for a project diary, proof explanation, benchmark result, or technical yap." },
      { id: "experiment", date: "2026-05-21", type: "note", title: "Small experiment title", read: "4 min", summary: "Short placeholder excerpt for a quick experiment." },
      { id: "build", date: "2026-05-18", type: "project-log", title: "Build diary title", read: "8 min", summary: "Short placeholder excerpt for a build diary." },
      { id: "proof", date: "2026-05-12", type: "math", title: "Proof note title", read: "6 min", summary: "Short placeholder excerpt for a math note." },
      { id: "misc", date: "2026-05-09", type: "misc", title: "Unsorted thought title", read: "3 min", summary: "Short placeholder excerpt for something uncategorized." }
    ]
  };

  function escapeHTML(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function color(text, cls) {
    return '<span class="' + cls + '">' + escapeHTML(text) + '</span>';
  }

  function cmdButton(command, label) {
    const safeCommand = escapeHTML(command);
    const safeLabel = escapeHTML(label || command);
    return '<button class="terminal-command" type="button" data-command="' + safeCommand + '">' + safeLabel + '</button>';
  }

  function line(text = "", cls = "") {
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.innerHTML = text;
    screen.appendChild(div);
    scrollBottom();
    return div;
  }

  function pre(text = "", cls = "") {
    const el = document.createElement("pre");
    el.className = "ascii-logo " + cls;
    el.textContent = text;
    screen.appendChild(el);
    scrollBottom();
    return el;
  }

  function blank() {
    const div = document.createElement("div");
    div.className = "blank";
    screen.appendChild(div);
    scrollBottom();
  }

  function scrollBottom() {
    screen.scrollTop = screen.scrollHeight;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function focusInput() {
    if (!activeInput || booting) return;
    activeInput.focus({ preventScroll: true });
    placeCaretEnd(activeInput);
  }

  function placeCaretEnd(el) {
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function currentCommandText() {
    return activeInput ? activeInput.textContent.replace(/\u00a0/g, " ").replace(/\u200B/g, "") : "";
  }

  function setCurrentCommand(text) {
    if (!activeInput) return;
    activeInput.textContent = text || "\u200B";
    placeCaretEnd(activeInput);
  }

  function appendPrompt() {
    const row = document.createElement("div");
    row.className = "line input-line";
    row.innerHTML =
      '<span class="prompt">guest@loganmesh</span>' +
      '<span>:<span class="cwd">' + state.cwd + '</span>$&nbsp;</span>' +
      '<span class="current-input" contenteditable="true" spellcheck="false" autocapitalize="none" role="textbox" aria-label="Terminal command input"></span>';
    screen.appendChild(row);
    activeInput = row.querySelector(".current-input");
    activeInput.textContent = "\u200B";
    activeInput.addEventListener("keydown", handleInputKeydown);
    activeInput.addEventListener("paste", handlePaste);
    scrollBottom();
    focusInput();
  }

  function freezePrompt(commandText) {
    commandText = String(commandText || "").replace(/\u200B/g, "");
    if (!activeInput) return;
    const row = activeInput.closest(".input-line");
    row.innerHTML =
      '<span class="prompt">guest@loganmesh</span>' +
      '<span>:<span class="cwd">' + state.cwd + '</span>$&nbsp;</span>' +
      '<span class="cmdtext">' + escapeHTML(commandText) + '</span>';
    activeInput = null;
  }

  async function bootSequence() {
    booting = true;
    if (activeInput) activeInput.setAttribute("contenteditable", "false");
    screen.innerHTML = "";
    activeInput = null;

    for (const row of bootLines) {
      await sleep(row.delay);
      line(escapeHTML(row.text), row.cls);
    }

    blank();
    pre(logo, "green");

    await sleep(120);
    line("Welcome to loganmesh.com.", "green");
    line("Type " + color("help", "cyan") + " or tap a command below.", "dim");
    renderCommandPalette();
    blank();

    booting = false;
    appendPrompt();
  }

  function renderCommandPalette() {
    line('<span class="green">clickable commands:</span>');
    line(
      cmdButton("help") + "  " +
      cmdButton("about") + "  " +
      cmdButton("projects") + "  " +
      cmdButton("notes") + "  " +
      cmdButton("blog") + "  " +
      cmdButton("contact") + "  " +
      cmdButton("clear") + "  " +
      cmdButton("reboot")
    );
  }

  function help() {
    line("Available commands:", "green");
    const wrapper = document.createElement("div");
    wrapper.className = "command-list";
    const rows = [
      ["help", "show this command list"],
      ["about", "print public identity placeholder"],
      ["ls", "list top-level site files"],
      ["tree", "show site structure"],
      ["projects", "list project slots"],
      ["open alpha", "open project alpha"],
      ["open beta", "open project beta"],
      ["open gamma", "open project gamma"],
      ["notes", "list note directories"],
      ["blog", "list blog/yap posts"],
      ["open post", "open featured post"],
      ["open experiment", "open experiment post"],
      ["contact", "show placeholder links"],
      ["date", "print local date"],
      ["uname", "print fake site kernel"],
      ["clear", "clear terminal"],
      ["reboot", "replay boot sequence"]
    ];

    for (const [cmd, desc] of rows) {
      const b = document.createElement("button");
      b.className = "terminal-command";
      b.type = "button";
      b.dataset.command = cmd;
      b.textContent = cmd;
      const d = document.createElement("span");
      d.className = "dim";
      d.textContent = desc;
      wrapper.appendChild(b);
      wrapper.appendChild(d);
    }

    screen.appendChild(wrapper);
    scrollBottom();
  }

  function about() {
    content.about.forEach(([k, v]) => {
      line(color(k.padEnd(10), "cyan") + escapeHTML(v));
    });
  }

  function ls() {
    line("about.txt");
    line("projects/");
    line("notes/");
    line("blog/");
    line("archive/");
    line("contact.txt");
  }

  function tree() {
    [
      "site/",
      "├── about.txt",
      "├── projects/",
      "│   ├── alpha.md",
      "│   ├── beta.md",
      "│   ├── gamma.md",
      "│   └── delta.md",
      "├── notes/",
      "│   ├── math/",
      "│   ├── systems/",
      "│   ├── games/",
      "│   └── misc/",
      "├── blog/",
      "│   ├── post.md",
      "│   ├── experiment.md",
      "│   ├── build.md",
      "│   ├── proof.md",
      "│   └── misc.md",
      "└── contact.txt"
    ].forEach(r => line(r));
  }

  function projects() {
    line("id      status      title", "green");
    line("--      ------      -----", "faint");
    content.projects.forEach(p => {
      line(cmdButton("open " + p.id, p.id.padEnd(8)) + p.status.padEnd(12) + escapeHTML(p.title));
    });
    line("");
    line("Tap a project id or type " + color("open alpha", "cyan") + ".", "dim");
  }

  function openProject(id) {
    const p = content.projects.find(x => x.id === id);
    if (!p) {
      line("open: no such project '" + escapeHTML(id || "") + "'", "red");
      line("Try: " + cmdButton("projects"), "dim");
      return;
    }
    line("# " + escapeHTML(p.title), "yellow");
    line("id:       " + escapeHTML(p.id));
    line("status:   " + escapeHTML(p.status));
    line("tags:     " + escapeHTML(p.tags));
    line("");
    line(escapeHTML(p.summary));
    line("");
    line("links:    /projects/" + escapeHTML(p.id) + "   /blog/" + escapeHTML(p.id) + "-writeup", "cyan");
  }

  function notes() {
    line("path".padEnd(44) + "summary", "green");
    line("----".padEnd(44) + "-------", "faint");
    content.notes.forEach(([path, desc]) => {
      line(path.padEnd(44) + desc);
    });
  }

  function blog() {
    line("date        type         read     title", "green");
    line("----        ----         ----     -----", "faint");
    content.posts.forEach(p => {
      line(p.date + "  " + p.type.padEnd(11) + "  " + p.read.padEnd(7) + "  " + cmdButton("open " + p.id, p.title));
    });
    line("");
    line("Tap a title or type " + color("open post", "cyan") + ".", "dim");
  }

  function openPost(id) {
    const p = content.posts.find(x => x.id === id);
    if (!p) {
      line("open: no such blog post '" + escapeHTML(id || "") + "'", "red");
      line("Try: " + cmdButton("blog"), "dim");
      return;
    }
    line("# " + escapeHTML(p.title), "yellow");
    line("date:     " + escapeHTML(p.date));
    line("type:     " + escapeHTML(p.type));
    line("read:     " + escapeHTML(p.read));
    line("");
    line(escapeHTML(p.summary));
    line("");
    line("Placeholder article body. In the real site, this could route to a full Markdown-rendered post while preserving terminal navigation.");
  }

  function contact() {
    line("github:    placeholder", "cyan");
    line("linkedin:  placeholder", "cyan");
    line("email:     placeholder@example.com", "cyan");
    line("rss:       /feed.xml", "cyan");
  }

  function unknown(cmd) {
    line("bash: " + escapeHTML(cmd.split(" ")[0] || "") + ": command not found", "red");
    line("Run " + cmdButton("help") + " for available commands.", "dim");
  }

  function executeCommand(raw) {
    if (booting) return;
    const cmd = raw.trim();
    if (!cmd) {
      freezePrompt("");
      appendPrompt();
      return;
    }

    freezePrompt(cmd);

    history.push(cmd);
    historyIndex = history.length;

    const lower = cmd.toLowerCase();
    const parts = lower.split(/\s+/);
    const main = parts[0];

    switch (main) {
      case "help": help(); break;
      case "about":
      case "whoami": about(); break;
      case "ls": ls(); break;
      case "tree": tree(); break;
      case "projects": projects(); break;
      case "notes": notes(); break;
      case "blog": blog(); break;
      case "contact": contact(); break;
      case "date": line(new Date().toString()); break;
      case "uname": line("loganmesh 0.5.1-terminal static-site interactive x86_64"); break;
      case "clear":
        screen.innerHTML = "";
        activeInput = null;
        renderCommandPalette();
        break;
      case "reboot":
      case "boot":
        bootSequence();
        return;
      case "open": {
        const id = parts[1];
        if (["alpha", "beta", "gamma", "delta"].includes(id)) openProject(id);
        else if (["post", "experiment", "build", "proof", "misc"].includes(id)) openPost(id);
        else {
          line("open: expected project/post id", "red");
          line("examples: " + cmdButton("open alpha") + ", " + cmdButton("open post") + ", " + cmdButton("open experiment"), "dim");
        }
        break;
      }
      case "cat": {
        const target = parts.slice(1).join(" ");
        if (target.includes("about")) about();
        else if (target.includes("contact")) contact();
        else if (target.includes("alpha")) openProject("alpha");
        else if (target.includes("post")) openPost("post");
        else line("cat: " + escapeHTML(target || "") + ": no such file in mock filesystem", "red");
        break;
      }
      default:
        unknown(cmd);
    }

    if (main !== "clear") blank();
    appendPrompt();
  }

  function runClickedCommand(cmd) {
    if (booting) return;
    if (activeInput) {
      setCurrentCommand(cmd);
      executeCommand(cmd);
    } else {
      appendPrompt();
      setCurrentCommand(cmd);
      executeCommand(cmd);
    }
  }

  function handleInputKeydown(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      executeCommand(currentCommandText());
    } else if (e.key === "ArrowUp") {
      if (!history.length) return;
      e.preventDefault();
      historyIndex = Math.max(0, historyIndex - 1);
      setCurrentCommand(history[historyIndex] || "");
    } else if (e.key === "ArrowDown") {
      if (!history.length) return;
      e.preventDefault();
      historyIndex = Math.min(history.length, historyIndex + 1);
      setCurrentCommand(history[historyIndex] || "");
    }
  }

  function handlePaste(e) {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text.replace(/\r?\n/g, " "));
  }

  function setCurrentCommand(text) {
    if (!activeInput) return;
    activeInput.textContent = text || "\u200B";
    placeCaretEnd(activeInput);
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-command]");
    if (btn) {
      const cmd = btn.getAttribute("data-command");
      if (cmd) runClickedCommand(cmd);
      return;
    }
    if (screen.contains(e.target)) focusInput();
  });

  screen.addEventListener("keydown", (e) => {
    if (!activeInput || document.activeElement === activeInput || booting) return;
    if (e.key.length === 1 || e.key === "Backspace" || e.key === "Enter") {
      focusInput();
    }
  });

  bootSequence();
})();
</script>
</body>
</html>
